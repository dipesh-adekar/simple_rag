{% extends "base.html" %}

{% block title %}Chat — Local RAG{% endblock %}

{% block content %}
<section class="card chat-card">
  <h1>Chat with your documents</h1>
  <p class="muted">Ask questions against your uploaded documents using qwen2.5:14b.</p>

  <div id="chat-messages" class="chat-messages">
    <p class="muted chat-empty">No messages yet. Ask something about your uploaded documents.</p>
  </div>

  <form id="chat-form" class="chat-form">
    <label for="source" class="label">Search in</label>
    <select id="source" name="source" class="input">
      <option value="">All documents</option>
      {% for doc in documents %}
      <option value="{{ doc.filename }}">{{ doc.filename }}</option>
      {% endfor %}
    </select>

    <textarea
      id="question"
      name="question"
      rows="3"
      placeholder="What does the document say about..."
      required
      class="input chat-input"
    ></textarea>

    <div class="chat-controls">
      <div class="mode-toggle" role="radiogroup" aria-label="Response mode">
        <label class="mode-option">
          <input type="radio" name="mode" value="stream" checked>
          <span>Stream</span>
        </label>
        <label class="mode-option">
          <input type="radio" name="mode" value="normal">
          <span>Normal</span>
        </label>
      </div>
      <button type="submit" class="btn btn-primary" id="chat-submit">Ask</button>
    </div>
  </form>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/chat.js"></script>
{% endblock %}
