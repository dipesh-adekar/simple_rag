{% extends "base.html" %}

{% block title %}Upload PDF — Local RAG{% endblock %}

{% block content %}
<section class="card">
  <h1>Upload PDF</h1>
  <p class="muted">Upload a PDF to index it with Ollama embeddings and query it in chat.</p>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="alert alert-success">{{ success }}</div>
  {% endif %}

  <form action="/upload" method="post" enctype="multipart/form-data" class="form">
    <label for="file" class="label">Choose PDF file</label>
    <input id="file" name="file" type="file" accept=".pdf,application/pdf" required class="input">
    <button type="submit" class="btn btn-primary">Upload &amp; Index</button>
  </form>
</section>
{% endblock %}
